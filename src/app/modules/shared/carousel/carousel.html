<div class="w-full">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-semibold text-gray-900">
      {{ title() | translate }}
    </h2>
  </div>

  <div
    class="flex flex-row flex-nowrap w-full gap-4 overflow-x-auto pb-2
           snap-x snap-mandatory scroll-smooth
           [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]"
  >
    @for (item of items(); track item.id) {
      <div
        (click)="cardClicked(item.id)"
        class="group snap-start shrink-0 w-44 rounded-xl border border-gray-200 bg-white
               shadow-sm overflow-hidden cursor-pointer
               transition-all duration-200 ease-out
               hover:shadow-lg hover:-translate-y-1 hover:border-purple-300"
      >
        <!-- Product Image -->
        <div class="h-44 w-full bg-gray-100 overflow-hidden">
          <img
            [src]="item.images[0].url"
            [alt]="item.name"
            class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
            loading="lazy"
          />
        </div>

        <!-- Product Info -->
        <div class="p-3">
          <p class="font-medium text-sm text-gray-900 truncate group-hover:text-purple-600 transition-colors">
            {{ item.name }}
          </p>

          <p class="text-xs text-gray-500 mt-1 line-clamp-2">
            {{ item.description }}
          </p>

          <p class="mt-2 text-xs text-purple-600 font-medium">
            {{ item.category.name }}
          </p>
        </div>
      </div>
    }
  </div>
</div>
