<div class="w-full">
    <div class=" h-10">
        {{title() | translate}}
    </div>
    <div class="flex flex-row flex-nowrap w-full overflow-x-auto gap-2">
         @for(item of items(); track item.id) {
        <div class="w-40 h-48 shrink-0 border-solid border-2 border-purple-500">
            {{item.name}}
        </div>
    }
    </div>
   
</div>
