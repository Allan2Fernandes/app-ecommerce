<div class="w-full">
  <div class="flex items-end justify-between mb-8 pb-3 border-b border-stone-400">
    <h2 class="text-3xl font-serif italic text-stone-800">
      {{ title() | translate }}
    </h2>
  </div>

  <div class="flex gap-6 overflow-x-auto pb-4">
    @for (item of items(); track item.id) {
      <div
        (click)="cardClicked(item.id)"
        class="shrink-0 w-80 rounded-xl border-2 border-stone-400 bg-stone-100 cursor-pointer hover:border-amber-700"
      >
        <div class="h-80 w-full bg-stone-300 overflow-hidden rounded-t-[0.65rem]">
          <img
            [src]="item.images[0].url"
            [alt]="item.name"
            class="w-full h-full object-cover"
            loading="lazy"
          />
        </div>

        <div class="p-5 flex flex-col gap-2">
          <p class="text-xs font-mono tracking-wider uppercase text-stone-500">
            {{ item.category.name }}
          </p>

          <div class="flex items-start justify-between gap-3">
            <p class="font-serif text-xl text-stone-900 leading-snug">
              {{ item.name }}
            </p>
            <p class="font-serif text-lg text-stone-900 whitespace-nowrap">
              {{ item.price | currency:'INR' }}
            </p>
          </div>

          <app-ratings-component [reviews]="item.reviews"/>
        </div>
      </div>
    }
  </div>
</div>
