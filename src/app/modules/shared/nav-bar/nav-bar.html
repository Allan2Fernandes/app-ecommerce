<div class="h-16 w-full flex items-center justify-between px-6 md:px-16 bg-stone-950 border-b border-stone-800">
  <div
    class="h-full flex items-center justify-start cursor-pointer gap-3 group"
    (click)="navigateByUrl('/store')"
  >
    <img
      src="{{icons.MARKET}}"
      class="h-8 w-8 flex-none transition-transform duration-200 group-hover:scale-105 brightness-0 invert opacity-60"
      alt="Logo"
    />
    <span class="text-sm tracking-wide text-stone-500 group-hover:text-stone-400 transition-colors">
      {{'TITLE' | translate}}
    </span>
  </div>

  <div class="flex-none flex items-center justify-end gap-3">
    <app-button
      text="Logout"
      [buttonStyle]="'flex items-center justify-center font-medium rounded-lg hover:bg-amber-700 bg-gray-900 h-10'"
      [contentStyle]="'flex items-center justify-center px-4 text-stone-200 font-serif'"
      (clicked)="logout()"
    />
  </div>
</div>
