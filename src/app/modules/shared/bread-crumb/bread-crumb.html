@if(!helper.isNullOrUndefined(category())) {
  @if(category()?.parent_nested) {
    <app-bread-crumb
      class="contents"
      [category]="category()?.parent_nested ?? undefined"
    />

    <span class="mx-1.5 text-stone-400 text-xs font-mono select-none">/</span>
  }
  <span class="text-xs font-mono text-stone-500 hover:text-amber-700 cursor-pointer transition-colors">
    {{ category()?.name }}
  </span>
}
