@if(!helper.isNullOrUndefined(selectedImage())) {
  <div class="relative w-full aspect-square shrink-0 overflow-hidden group border-2 border-stone-800">
    <img
      [src]="selectedImage().url"
      [alt]="name()"
      loading="lazy"
      class="h-full w-full object-cover block"
    />

    <button
      type="button"
      (click)="previousClicked()"
      class="absolute left-3 top-1/2 -translate-y-1/2 bg-stone-950/80 hover:bg-amber-700 text-stone-200 rounded-md px-3 py-2 font-serif transition-colors"
      aria-label="Previous image"
    >
      {{'<'}}
    </button>

    <button
      type="button"
      (click)="nextClicked()"
      class="absolute right-3 top-1/2 -translate-y-1/2 bg-stone-950/80 hover:bg-amber-700 text-stone-200 rounded-md px-3 py-2 font-serif transition-colors"
      aria-label="Next image"
    >
      {{'>'}}
    </button>
  </div>
}
