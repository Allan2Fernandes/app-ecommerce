<!--
  This example requires updating your template:

  ```
  <html class="h-full bg-gray-900">
  <body class="h-full">
  ```
-->
<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-sm">
    <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500" alt="Your Company" class="mx-auto h-10 w-auto" />
    <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight">{{"SIGN_IN" | translate}}</h2>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
    <form class="space-y-6" [formGroup]="form">
      <div>
        <label for="email" class="block text-sm/6 font-medium text-gray-400">{{"EMAIL_ADDRESS" | translate}}</label>
        <div class="mt-2">
          <input id="email" type="email" formControlName="email" required autocomplete="email" class="block w-full rounded-md bg-gray-100 px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" />
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between">
          <label for="password" class="block text-sm/6 font-medium text-gray-400">{{"PASSWORD" | translate}}</label>
          <div class="text-sm">
            <a href="#" class="font-semibold text-indigo-400 hover:text-indigo-300">{{"FORGOT_PASSWORD" | translate}}</a>
          </div>
        </div>
        <div class="mt-2">
          <input id="password" type="password" formControlName="password" required autocomplete="current-password" class="block w-full rounded-md bg-gray-100 px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" />
        </div>
      </div>

      <div>
        <button [disabled]="!form.valid" class="flex w-full justify-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm/6 font-semibold text-white hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500" (click)="login()">{{'SIGN_IN' | translate}}</button>
      </div>
    </form>

    <p class="mt-10 text-center text-sm/6 text-gray-400">
      {{"NOT_MEMBER" | translate}}
      <a href="/authorization/signup" class="font-semibold text-indigo-400 hover:text-indigo-300">{{"SIGN_UP_HERE" | translate}}</a>
    </p>
  </div>
</div>
